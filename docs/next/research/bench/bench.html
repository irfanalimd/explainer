<script type="module">
// Standalone R1 benchmark (no imports, works from file:// or http). Same scene on both backends:
//   shadow (2048^2 depth, all slabs) -> main (MSAA, 2x RGBA16F MRT: colour + emission; rounded-box slabs,
//   key light with 3x3 PCF + 16 point lights; additive particles) -> resolve -> optional proxies
//   (ao: half-res 16-tap horizon AO; ssr: half-res 32-step ray march; taa: 3x3 clamp + history;
//   mb: 12-tap velocity blur) -> dual-filter bloom (6 down, 5 up) -> composite (tonemap, vignette, grain).
// Particles: WebGPU computes them in a compute pass into a storage buffer; WebGL2 evaluates the same
// stateless function of (seed, t) in the vertex shader. Both are deterministic in t.
// Query / __bench(opts): backend=webgpu|webgl2 n=300 particles=0 w=2560 h=1440 msaa=4 extras=ao,ssr,taa,mb
//   frames=120 warm=30
const Q = new URLSearchParams(location.search);
const out = document.getElementById("out");
const PASSES = ["shadow", "compute", "main", "ao", "ssr", "taa", "mb", "bloom", "composite"];

// ---------- shared: deterministic data, mesh, maths ----------
function pcg(v) { v = (Math.imul(v >>> 0, 747796405) + 2891336453) >>> 0; let w = Math.imul(((v >>> ((v >>> 28) + 4)) ^ v) >>> 0, 277803737) >>> 0; return ((w >>> 22) ^ w) >>> 0; }
const rnd = (i) => pcg(i) / 4294967295;
function roundedBox(k = 12, r = 0.25) {          // k x k quads per face, ~ 6*k*k*2 triangles (k=12: 1728)
  const pos = [], nor = [], idx = [];
  const faces = [[0, 1, 2, 1], [0, 1, 2, -1], [1, 2, 0, 1], [1, 2, 0, -1], [2, 0, 1, 1], [2, 0, 1, -1]];
  const inner = 1 - r;
  for (const [a, b, c, s] of faces) {
    const base = pos.length / 3;
    for (let j = 0; j <= k; j++) for (let i = 0; i <= k; i++) {
      const v = [0, 0, 0]; v[a] = (i / k) * 2 - 1; v[b] = (j / k) * 2 - 1; v[c] = s;
      if (s < 0) v[a] = -v[a];
      const cl = v.map((x) => Math.max(-inner, Math.min(inner, x)));
      const d = v.map((x, q) => x - cl[q]); const L = Math.hypot(...d) || 1;
      const p = cl.map((x, q) => x + d[q] / L * r);
      pos.push(p[0] * 0.5, p[1] * 0.5, (p[2] + 1) * 0.5); nor.push(d[0] / L, d[1] / L, d[2] / L);
    }
    for (let j = 0; j < k; j++) for (let i = 0; i < k; i++) {
      const q0 = base + j * (k + 1) + i, q1 = q0 + 1, q2 = q0 + k + 1, q3 = q2 + 1;
      idx.push(q0, q1, q3, q0, q3, q2);
    }
  }
  const vb = new Float32Array(pos.length * 2);
  for (let i = 0; i < pos.length / 3; i++) { vb.set(pos.slice(i * 3, i * 3 + 3), i * 6); vb.set(nor.slice(i * 3, i * 3 + 3), i * 6 + 3); }

}
function instances(n) {        // instance 0 is the floor; 3 vec4 per instance: pos+yaw, size+emissive, colour+pad
  const a = new Float32Array((n + 1) * 12), side = Math.ceil(Math.sqrt(n)), sp = 70;
  a.set([0, 0, -1, 0, side * sp * 3, side * sp * 3, 1, 0, 0.06, 0.07, 0.1, 0], 0);
  for (let i = 0; i < n; i++) {
    const gx = i % side, gy = Math.floor(i / side), o = (i + 1) * 12;
    const em = rnd(i * 17 + 3) < 0.08 ? 2.5 : 0;
    a.set([(gx - side / 2 + 0.5) * sp, (gy - side / 2 + 0.5) * sp, 0, rnd(i * 5) * 0.4 - 0.2,
      26 + 30 * rnd(i * 7), 26 + 20 * rnd(i * 9), 5 + 12 * rnd(i * 11), em,
      0.2 + 0.6 * rnd(i * 13), 0.2 + 0.6 * rnd(i * 19), 0.3 + 0.6 * rnd(i * 23), 0], o);

}
const norm = (v) => { const l = Math.hypot(...v) || 1; return v.map((x) => x / l); };

// one uniform block for every pass: vp, lvp, eye, key, time(t, frame, nInst, nPart), camR, camU, lp[16], lc[16]
function uniforms(o, t, frame, ext, zeroOne) {
  const U = new Float32Array(16 * 2 + 4 * 5 + 64 * 2);
  const dist = ext * 1.25 + 300, yaw = 0.35 + 0.05 * Math.sin(t * 0.3), pitch = 0.62;
  const eye = [dist * Math.cos(pitch) * Math.sin(yaw), dist * Math.cos(pitch) * Math.cos(yaw), dist * Math.sin(pitch)];
  const view = lookAt(eye, [0, 0, 0], [0, 0, 1]);
  const vp = mul(persp(0.55, o.w / o.h, dist * 0.2, dist * 4, zeroOne), view);
  const key = norm([-0.45, 0.35, 0.82]);
  const lv = lookAt(key.map((x) => x * ext * 2), [0, 0, 0], [0, 0, 1]);
  const lvp = mul(ortho(-ext * 0.75, ext * 0.75, -ext * 0.75, ext * 0.75, 1, ext * 4, zeroOne), lv);
  U.set(vp, 0); U.set(lvp, 16);
  U.set([...eye, 0], 32); U.set([...key, 0], 36); U.set([t, frame, o.n + 1, o.particles], 40);
  U.set([view[0], view[4], view[8], 0], 44); U.set([view[1], view[5], view[9], 0], 48);
  for (let k = 0; k < 16; k++) {
    const i = 1 + (pcg(k * 31) % Math.max(1, o.n));
    U.set([0, 0, 0, 0], 52 + k * 4);
    U.set([(rnd(k * 3) - 0.5) * ext, (rnd(k * 3 + 1) - 0.5) * ext, 20, 120], 52 + k * 4);
    U.set([0.3 + rnd(k), 0.4, 1.2 - rnd(k), 1], 116 + k * 4);
  }

}
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[s.length >> 1] : 0; };

// ---------- WGSL ----------
const WG_U = /* wgsl */`

@group(0) @binding(0) var<uniform> u: U;
fn pcg(v: u32) -> u32 { let s = v * 747796405u + 2891336453u; let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
fn rnd(v: u32) -> f32 { return f32(pcg(v)) / 4294967295.0; }
struct FS { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn fsq(@builtin(vertex_index) i: u32) -> FS {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  return FS(vec4f(p, 0.0, 1.0), vec2f(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5));
}`;
const WG_SLAB = WG_U + /* wgsl */`
@group(0) @binding(1) var<storage, read> inst: array<vec4f>;
@group(0) @binding(2) var shadowTex: texture_depth_2d;
@group(0) @binding(3) var shadowSmp: sampler_comparison;
struct VO { @builtin(position) pos: vec4f, @location(0) w: vec3f, @location(1) n: vec3f, @location(2) @interpolate(flat) id: u32 };
fn place(p: vec3f, nn: vec3f, id: u32) -> array<vec3f, 2> {
  let a = inst[id * 3u]; let s = inst[id * 3u + 1u]; let c = cos(a.w); let sn = sin(a.w); let q = p * s.xyz;
  return array<vec3f, 2>(vec3f(c * q.x - sn * q.y, sn * q.x + c * q.y, q.z) + a.xyz, vec3f(c * nn.x - sn * nn.y, sn * nn.x + c * nn.y, nn.z));
}
@vertex fn vs(@location(0) p: vec3f, @location(1) nn: vec3f, @builtin(instance_index) id: u32) -> VO {
  let w = place(p, nn, id); return VO(u.vp * vec4f(w[0], 1.0), w[0], w[1], id);

@vertex fn vsShadow(@location(0) p: vec3f, @location(1) nn: vec3f, @builtin(instance_index) id: u32) -> @builtin(position) vec4f {
  return u.lvp * vec4f(place(p, nn, id)[0], 1.0);

@fragment fn fs(i: VO) -> FO {

const WG_PART = WG_U + /* wgsl */`
@group(0) @binding(1) var<storage, read> inst: array<vec4f>;
@group(0) @binding(4) var<storage, read_write> parts: array<vec4f>;
@compute @workgroup_size(64) fn cs(@builtin(global_invocation_id) g: vec3u) {

const WG_PDRAW = WG_U + /* wgsl */`
@group(0) @binding(4) var<storage, read> parts: array<vec4f>;
struct PO { @builtin(position) pos: vec4f, @location(0) q: vec2f, @location(1) c: vec3f };

  let q = vec2f(f32(v & 1u), f32(v >> 1u)) * 2.0 - 1.0; let p = parts[i * 2u];

struct FO { @location(0) c: vec4f, @location(1) e: vec4f };
@fragment fn fs(i: PO) -> FO { let a = max(0.0, 1.0 - dot(i.q, i.q)); return FO(vec4f(i.c * a * 0.2, 0.0), vec4f(i.c * a, 0.0)); }`;
const WG_POST = WG_U + /* wgsl */`
@group(1) @binding(0) var src: texture_2d<f32>;
@group(1) @binding(1) var base: texture_2d<f32>;
@group(1) @binding(2) var smp: sampler;
@group(1) @binding(3) var depthMS: texture_depth_multisampled_2d;
@group(1) @binding(4) var aoT: texture_2d<f32>;
@group(1) @binding(5) var ssrT: texture_2d<f32>;

// ---------- WebGPU backend ----------
async function benchWebGPU(o, canvas) {
  if (!navigator.gpu) throw new Error("navigator.gpu missing (isSecureContext=" + isSecureContext + ")");
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) throw new Error("no adapter");
  const ts = adapter.features.has("timestamp-query");
  const device = await adapter.requestDevice({ requiredFeatures: ts ? ["timestamp-query"] : [] });

  const vb = buf(mesh.vb, GPUBufferUsage.VERTEX), ib = buf(mesh.ib, GPUBufferUsage.INDEX), ibuf = buf(inst.data, GPUBufferUsage.STORAGE);
  const ubuf = device.createBuffer({ size: 4 * (32 + 20 + 128), usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const pbuf = device.createBuffer({ size: Math.max(32, o.particles * 32), usage: GPUBufferUsage.STORAGE });
  const tex = (w, h, format, usage, sampleCount = 1) => device.createTexture({ size: [w, h], format, usage, sampleCount });

  const msC = msaa > 1 ? tex(W, H, "rgba16float", RT, msaa) : null, msE = msaa > 1 ? tex(W, H, "rgba16float", RT, msaa) : null;
  const depth = tex(W, H, "depth32float", RT | TB, msaa > 1 ? msaa : 1);
  const color = tex(W, H, "rgba16float", RT | TB), emis = tex(W, H, "rgba16float", RT | TB);
  const hist = [tex(W, H, "rgba16float", RT | TB), tex(W, H, "rgba16float", RT | TB)], mbT = tex(W, H, "rgba16float", RT | TB);
  const depth1 = tex(W, H, "r32float", RT | TB), aoT = tex(W >> 1, H >> 1, "r16float", RT | TB), ssrT = tex(W >> 1, H >> 1, "rgba16float", RT | TB);
  const down = [], up = []; { let w = W, h = H; for (let i = 0; i < 6; i++) { w = Math.max(1, w >> 1); h = Math.max(1, h >> 1); down.push({ t: tex(w, h, "rgba16float", RT | TB), w, h }); up.push({ t: tex(w, h, "rgba16float", RT | TB), w, h }); } }
  const mod = (code) => device.createShaderModule({ code });
