<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD mock</title>
<style>
  @font-face { font-family: "Geist"; src: url("../../assets/fonts/Geist-latin.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/GeistMono-latin.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #ix { position: fixed; inset: 0; }
</style>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div id="ix" class="ix" data-theme="dark"><canvas class="ix-canvas"></canvas></div>
<script type="module">
// HUD mock: the complete HUD over a placeholder 2D stage, driven by a small, honest MapReduce word count
// (it really splits, maps, partitions, sorts and folds the input), so every caption and counter is true.
//   ?theme=light   ?open=settings|inspector|code|help|ask|reveal|preview|speed|tags   ?at=<seconds>   ?scenario=crash
//   ?motion=reduce   ?compare=1 (meters race the run with and without a combiner)   ?capture=1|chrome
import { createHud } from "./hud.mjs";
import { PALETTE, MOTION, keyColor } from "../tokens.mjs";

const Q = new URLSearchParams(location.search);
const root = document.getElementById("ix");
const canvas = root.querySelector("canvas");
const ctx = canvas.getContext("2d");
let theme = Q.get("theme") === "light" ? "light" : "dark";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);

// ---------------- figure definition ----------------
const meta = {
  title: "MapReduce", subtitle: "Counting words across a cluster", kicker: "Distributed systems", fig: 1,
  cite: { text: "Dean & Ghemawat, OSDI 2004", url: "https://research.google/pubs/pub62/" }, theme: "dark",
};
const params = {
  mappers: { label: "Mappers", type: "int", min: 1, max: 6, value: 3 },
  reducers: { label: "Reducers", type: "int", min: 1, max: 4, value: 2 },
  combiner: { label: "Combiner", type: "bool", value: false },
  partitioner: { label: "Partitioner", type: "select", value: "hash", options: [{ value: "hash", label: "hash(key) % R" }, { value: "range", label: "Key range (a–z split)" }] },
  latency: { label: "Network latency", type: "float", min: 0.5, max: 20, step: 0.5, value: 4, unit: "ms" },
  input: { label: "Input", type: "text", value: "the quick brown fox jumps over the lazy dog the fox" },
  seed: { label: "Seed", type: "int", value: 7 },
};
const scenarios = [
  { id: "happy", label: "Happy path" },
  { id: "crash", label: "Worker dies", params: { crash: 1 } },
  { id: "skew", label: "Skewed keys", params: { input: "the cat and the dog and the bird and the fish and the end" } },
];
// ?compare=1 races the same job with and without a combiner (both runs are computed; values come from each run)
const COMPARE = Q.has("compare");
const counters = COMPARE ? {
  records: { label: "records emitted", short: "emitted", format: "int" },
  tasks: { label: "tasks done", format: "int" },
  "plain.sent": { label: "records shuffled", short: "shuffled", group: "no combiner", better: "lower" },
  "comb.sent": { label: "records shuffled", short: "shuffled", group: "combiner", better: "lower" },
  "plain.bytes": { label: "bytes over the network", short: "bytes", group: "no combiner", format: "bytes", better: "lower" },
  "comb.bytes": { label: "bytes over the network", short: "bytes", group: "combiner", format: "bytes", better: "lower" },
} : {
  records: { label: "records emitted", short: "emitted", format: "int" },
  bytes: { label: "shuffled", format: "bytes" },
  tasks: { label: "tasks done", short: "tasks", format: "int" },
  time: { label: "sim time", format: "ms" },
};
const code = {
  lang: "python",
  source: [
    "def map_task(split):", "    for word in split.split():", "        emit(word, 1)", "",
    "def partition(key, R):", "    return hash(key) % R", "",
    "def reduce_task(key, counts):", "    total = 0", "    for c in counts:", "        total += c", "    emit(key, total)",
  ].join("\n"),
};

// ---------------- a tiny honest run, recorded as steps ----------------
function fnv(s, seed) { let h = (2166136261 ^ (seed * 2654435761)) >>> 0; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function rng(seed) { let a = seed >>> 0 || 1; return () => { a ^= a << 13; a ^= a >>> 17; a ^= a << 5; return ((a >>> 0) % 100000) / 100000; }; }

function build(p, scenarioId) {
  const sc = scenarios.find((s) => s.id === scenarioId) ?? scenarios[0];
  const crash = !!sc.params?.crash;
  const words = String(p.input).toLowerCase().split(/[^a-z0-9']+/).filter(Boolean).slice(0, 28);
  if (!words.length) words.push("empty");
  const M = clamp(Math.round(p.mappers), 1, 6), R = clamp(Math.round(p.reducers), 1, 4);
  const rand = rng(p.seed * 97 + 13);
  const partOf = (w) => (p.partitioner === "range" ? clamp(Math.floor(((w.charCodeAt(0) - 97) / 26) * R), 0, R - 1) : fnv(w, p.seed) % R);
  const hashTag = (w) => (p.partitioner === "range" ? `"${w[0]}" → range ${partOf(w)}` : `hash("${w}") % ${R} = ${partOf(w)}`);
  const keyIdx = new Map();
  for (const w of words) if (!keyIdx.has(w)) keyIdx.set(w, keyIdx.size);
  const per = Math.ceil(words.length / M);
  const splits = Array.from({ length: M }, (_, i) => words.slice(i * per, (i + 1) * per)).filter((s) => s.length);
  const mapIds = splits.map((_, i) => `m${i}`), redIds = Array.from({ length: R }, (_, i) => `r${i}`);
  const fmtB = (b) => (b < 1024 ? `${b} B` : `${(b / 1024).toFixed(1)} KB`);
  const list = (xs) => (xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`);
  const K = (w, n) => `{key:${w}${n != null ? `|${w} · ${n}` : ""}}`;
  const ref = (id, text) => `{ref:${id}|${text}}`;

  const boxes = { input: { id: "input", kind: "store", title: "Input" }, out: { id: "out", kind: "store", title: "Output" } };
  mapIds.forEach((id, i) => { boxes[id] = { id, kind: "node", title: `Mapper ${i}`, addr: `192.0.2.${11 + i}` }; });
  redIds.forEach((id, i) => { boxes[id] = { id, kind: "node", title: `Reducer ${i}`, addr: `198.51.100.${21 + i}` }; });

  const st = { slots: {}, items: {}, led: {}, dim: {} };
  for (const id in boxes) { st.slots[id] = []; st.led[id] = id === "input" || id === "out" ? "ok" : "idle"; st.dim[id] = false; }
  const C = { records: 0, bytes: 0, tasks: 0, time: 0, sent: 0 };
  const steps = [];
  let phase = "", ops;
  const fresh = () => ({ moves: [], spawns: [], removes: [], tags: [], lit: [], kinds: [] });
  ops = fresh();
  const snap = () => ({ slots: Object.fromEntries(Object.entries(st.slots).map(([k, v]) => [k, v.slice()])), items: JSON.parse(JSON.stringify(st.items)), led: { ...st.led }, dim: { ...st.dim } });
  const opening = { ...snap(), counters: { ...C } };
  const at = (id) => Object.keys(st.slots).find((b) => st.slots[b].includes(id));
  const spawn = (id, box, item, from = box) => { st.items[id] = { id, ...item }; st.slots[box].push(id); ops.spawns.push({ id, from }); };
  const move = (id, box) => { const b = at(id); st.slots[b].splice(st.slots[b].indexOf(id), 1); st.slots[box].push(id); ops.moves.push(id); };
  const remove = (id, into) => { const b = at(id); st.slots[b].splice(st.slots[b].indexOf(id), 1); ops.removes.push({ id, into, item: st.items[id] }); delete st.items[id]; };
  const step = (caption, o = {}) => {
    C.time += o.sim ?? 0.6;
    steps.push({ caption, phase, ...snap(), counters: { ...C }, line: o.line ?? null, vars: o.vars ?? null, ask: o.ask ?? null, dur: o.dur ?? 1.35, ops });
    ops = fresh();
  };
  const net = () => p.latency * (0.75 + 0.5 * rand());
  const rec = (w, n = 1) => ({ kind: "record", word: w, key: keyIdx.get(w), n, part: partOf(w), text: `${w} · ${n}` });

  // Split
  phase = "Split";
  st.items.in = { id: "in", kind: "page", text: `input · ${words.join(" ").length} B` };
  st.slots.input.push("in");
  opening.slots = snap().slots; opening.items = snap().items;
  const shown = words.join(" ");
  step(`The job's input is one line of text, \`${shown.length > 54 ? shown.slice(0, 52) + "…" : shown}\`: **${words.length} words** in all.`, { dur: 1.8 });
  remove("in");
  splits.forEach((s, i) => spawn(`s${i}`, "input", { kind: "page", text: `split ${i} · ${s.length}w` }));
  ops.kinds.push("spawn");
  step(splits.length > 1 ? `The master cuts it into **${splits.length} splits**, one per mapper, so they can all work at once.` : "The input is small enough for a **single split**.", { sim: 1.2 });
  ops.lit.push(...splits.map((_, i) => `s${i}`));
  step(`Split 0 is \`${splits[0].join(" ")}\`${splits[1] ? `, split 1 is \`${splits[1].join(" ")}\`` : ""}${splits.length > 2 ? ", and so on" : ""}.`, { dur: 1.8 });

  // Map
  phase = "Map";
  const mapRun = (si, mi, words2, rerun) => {
    const m = mapIds[mi], page = rerun ? `s${si}r` : `s${si}`;
    if (rerun) { spawn(page, "input", { kind: "page", text: `split ${si} · ${words2.length}w` }); ops.spawns.length = 0; ops.spawns.push({ id: page, from: "input" }); }
    move(page, m); st.led[m] = "busy"; ops.kinds.push("send");
    if (!rerun) {
      step(si === 0 ? `The master assigns split 0 to ${ref(m, "mapper 0")}; the page travels along its trace.` : `Split ${si} goes to ${ref(m, `mapper ${mi}`)}.`, { line: [1, 1], sim: net() });
    }
    const chunk = si === 0 && !rerun ? 1 : 2;
    let emitted = 0;
    for (let j = 0; j < words2.length; j += chunk) {
      const ws = words2.slice(j, j + chunk);
      ws.forEach((w, k) => { spawn(`k${si}${rerun ? "r" : ""}_${j + k}`, m, rec(w)); C.records++; emitted++; });
      ops.kinds.push("spawn");
      if (crash && si === 1 && !rerun && emitted >= Math.min(2, words2.length - 1) && mapIds.length > 1) {
        step(`${ref(m, `Mapper ${mi}`)} emits ${ws.map((w) => K(w, 1)).join(" and ")}.`, { line: [2, 3], vars: { word: ws[ws.length - 1] }, sim: 0.8 });
        st.led[m] = "fail"; st.dim[m] = true; ops.kinds.push("crash");
        ops.tags.push({ id: "hb", text: "heartbeat missed · 3 × 1 s", tone: "fail", box: m });
        step(`${ref(m, `Mapper ${mi}`)} stops answering heartbeats. The master marks its task {tone:fail|failed}.`, { sim: 3000 });
        return "crashed";
      }
      const last = j + chunk >= words2.length;
      const lead = si === 0 && j === 0 && !rerun ? `${ref(m, "Mapper 0")} runs \`map()\` on its split and emits ${K(ws[0], 1)}.`
        : si === 0 && j === 1 && !rerun ? `Then ${K(ws[0], 1)}: one record per word, keyed by the word.`
        : `${j === 0 && !rerun ? "It emits" : rerun && j === 0 ? `${ref(m, `Mapper ${mi}`)} emits` : "Then"} ${ws.map((w) => K(w, 1)).join(" and ")}${!last ? "." : ""}`;
      if (last) {
        remove(page); st.led[m] = "ok"; C.tasks++; ops.kinds.push("done");
        step(`${lead}${lead.endsWith(".") ? "" : "."} ${ref(m, `Mapper ${mi}`)} is {tone:ok|done}${rerun ? " with the re-run" : ""}: ${st.slots[m].length} records in its tray.`, { line: [2, 3], vars: { word: ws[ws.length - 1] }, sim: 0.8 * ws.length });
      } else step(lead, { line: [2, 3], vars: { word: ws[ws.length - 1] }, sim: 0.8 * ws.length });
    }
    if (p.combiner) {
      const groups = new Map();
      for (const id of st.slots[m]) { const it = st.items[id]; if (!groups.has(it.word)) groups.set(it.word, []); groups.get(it.word).push(id); }
      const dup = [...groups].filter(([, ids]) => ids.length > 1);
      if (dup.length) {
        for (const [w, ids] of dup) {
          const keep = ids[0]; let n = st.items[keep].n;
          for (const id of ids.slice(1)) { n += st.items[id].n; remove(id, keep); }
          Object.assign(st.items[keep], { n, text: `${w} · ${n}` }); ops.lit.push(keep);
        }
        step(`The combiner folds equal words inside ${ref(m, `mapper ${mi}`)} before the shuffle: ${list(dup.map(([w, ids]) => K(w, ids.length)))}.`, { line: [9, 11], sim: 0.5 });
      }
    }
    return "ok";
  };
  let crashed = null;
  splits.forEach((s, i) => {
    const r = mapRun(i, i, s, false);
    if (r === "crashed") {
      crashed = i;
      const lost = st.slots[mapIds[i]].filter((id) => st.items[id].kind === "record");
      lost.forEach((id) => remove(id));
      remove(`s${i}`);
      const helper = 0;
      ops.kinds.push("retry");
      step(`Its ${lost.length} records are lost with it. The master re-runs split ${i} on ${ref(mapIds[helper], `mapper ${helper}`)}, which is idle.`, { sim: net() });
      mapRun(i, helper, s, true);
    }
  });
  const inTrays = mapIds.reduce((n, m) => n + st.slots[m].length, 0);
  step(`All ${splits.length} map tasks are {tone:ok|done}${crashed != null ? ", one of them twice" : ""}. **${inTrays} records** wait in the mapper trays.`, { dur: 1.6, sim: 0.4 });

  // Shuffle
  phase = "Shuffle";
  const queue = [];
  mapIds.forEach((m) => st.slots[m].forEach((id) => queue.push(id)));
  const holders = new Map();
  for (const id of queue) { const w = st.items[id].word; if (!holders.has(w)) holders.set(w, new Set()); holders.get(w).add(at(id)); }
  const askWord = [...holders].find(([, s]) => s.size === 2)?.[0] ?? [...holders].find(([, s]) => s.size > 2)?.[0];
  const ship = (ids) => {
    for (const id of ids) {
      const it = st.items[id]; const r = partOf(it.word);
      move(id, redIds[r]); C.bytes += it.word.length + 4; C.sent++;
      ops.tags.push({ id: `t-${id}`, text: hashTag(it.word), item: id });
    }
    ops.kinds.push("send");
  };
  let shipped = 0;
  if (askWord) {
    const ids = queue.filter((id) => st.items[id].word === askWord);
    const r = partOf(askWord), n = holders.get(askWord).size;
    ship(ids);
    step(`Every record of ${K(askWord)} lands on ${ref(redIds[r], `reducer ${r}`)}: \`${hashTag(askWord)}\` on every machine.`, {
      line: [5, 6], vars: { key: askWord, R }, sim: net(),
      ask: { question: `${n === 2 ? "Two" : n} mappers each hold a ${K(askWord, 1)}. Where do those records end up?`, options: ["On the same reducer", "On different reducers, one each", "On whichever reducer is free first"], answer: 0 },
    });
    shipped++;
  }
  const rest = queue.filter((id) => st.items[id].word !== askWord);
  for (let i = 0; i < rest.length;) {
    const take = shipped < 4 ? 1 : 2;
    const ids = rest.slice(i, i + take); i += take;
    const ws = ids.map((id) => st.items[id].word), rs = ws.map(partOf);
    ship(ids);
    const text = shipped === 1 || (!askWord && shipped === 0)
      ? `Each record crosses the shuffle bus to reducer \`${p.partitioner === "range" ? "range(key)" : `hash(key) % ${R}`}\`. ${K(ws[0])} goes to ${ref(redIds[rs[0]], `reducer ${rs[0]}`)}.`
      : ids.length === 1 ? `${K(ws[0])} ${p.partitioner === "range" ? "falls in range" : "hashes to"} ${rs[0]}, so it crosses to ${ref(redIds[rs[0]], `reducer ${rs[0]}`)}.`
      : `${K(ws[0])} goes to reducer ${rs[0]}, ${K(ws[1])} to reducer ${rs[1]}.`;
    step(text, { line: [5, 6], vars: { key: ws[ws.length - 1], R }, sim: net() });
    shipped++;
  }
  step(`The shuffle moved **${fmtB(C.bytes)}** in ${queue.length} records: each is its key plus 4 bytes for the count.`, { dur: 1.8, sim: 0.3 });

  // Reduce
  phase = "Reduce";
  redIds.forEach((r) => { st.led[r] = "busy"; });
  step(`${redIds.map((r, i) => `${ref(r, `${i === 0 ? "Reducer" : "reducer"} ${i}`)} holds ${st.slots[r].length}`).join(redIds.length > 2 ? ", " : " and ")} records.`, { line: [8, 8], sim: 0.4 });
  for (const r of redIds) st.slots[r].sort((a, b) => st.items[a].word.localeCompare(st.items[b].word));
  ops.moves.push(...redIds.flatMap((r) => st.slots[r]));
  step("Each reducer sorts its records by key, so equal words sit side by side.", { line: [8, 8], sim: 1.1 });
  redIds.forEach((r, ri) => {
    const runs = new Map();
    for (const id of st.slots[r]) { const w = st.items[id].word; if (!runs.has(w)) runs.set(w, []); runs.get(w).push(id); }
    const singles = [];
    for (const [w, ids] of runs) {
      if (ids.length === 1 && st.items[ids[0]].n === 1) { singles.push(w); continue; }
      const keep = ids[0]; let n = 0;
      for (const id of ids) n += st.items[id].n;
      for (const id of ids.slice(1)) remove(id, keep);
      Object.assign(st.items[keep], { n, text: `${w} · ${n}` }); ops.lit.push(keep); ops.kinds.push("merge");
      step(`${ref(r, `Reducer ${ri}`)} folds the run of ${ids.length > 1 ? ids.length : "one"} ${K(w)} record${ids.length > 1 ? "s" : ""} into ${K(w, n)}.`, { line: [9, 11], vars: { key: w, total: n }, sim: 0.6 });
    }
    st.led[r] = "ok"; C.tasks++; ops.kinds.push("done");
    const one = singles.length === 1;
    step(`${singles.length ? `${list(singles.map((w) => K(w)))} ${one ? "is a run" : "are runs"} of one, so ${one ? "its total stays" : "their totals stay"} 1. ` : ""}${ref(r, `Reducer ${ri}`)} is {tone:ok|done}.`, { line: [12, 12], sim: 0.5 });
  });

  // Output
  phase = "Output";
  redIds.forEach((r, ri) => {
    const ids = st.slots[r].slice();
    for (let i = 0; i < ids.length; i += 2) {
      const two = ids.slice(i, i + 2);
      two.forEach((id) => move(id, "out")); ops.kinds.push("send");
      step(`${ref(r, `Reducer ${ri}`)} writes ${two.map((id) => K(st.items[id].word, st.items[id].n)).join(" and ")} to ${ref("out", "the output")}.`, { sim: net() });
    }
  });
  const total = st.slots.out.reduce((n, id) => n + st.items[id].n, 0);
  ops.lit.push("out");
  step(`The output holds **${st.slots.out.length} distinct words**; their counts sum to ${total}, the number of words in the input.`, { dur: 2, sim: 0.2 });
  step("That is MapReduce: **map** emits pairs, the **shuffle** groups them by key, and **reduce** folds each group.", { dur: 2.6, sim: 0 });

  return { steps, opening, boxes, mapIds, redIds, keyIdx, words };
}

// ---------------- timeline (the shape of CONTRACTS.md 4.3) ----------------
function compile(values, scenarioId) {
  const run = build(values, scenarioId);
  let t = 0;
  const steps = run.steps.map((s, index) => { const st = { ...s, index, t0: t, t1: t + s.dur, kinds: s.ops.kinds }; t += s.dur; return st; });
  const phases = [];
  steps.forEach((s, i) => { if (!phases.length || phases[phases.length - 1].name !== s.phase) phases.push({ name: s.phase, step: i, t0: s.t0, t1: s.t1 }); else phases[phases.length - 1].t1 = s.t1; });
  const events = steps.flatMap((s) => s.kinds.map((kind) => ({ t: s.t0 + s.dur * 0.15, kind, step: s.index })));
  const keys = [...run.keyIdx].map(([name, index]) => ({ name, index }));
  if (COMPARE) {
    // align the two runs by phase: step k of a phase maps to the same fraction of that phase in each run
    const runs = { plain: build({ ...values, combiner: false }, scenarioId), comb: build({ ...values, combiner: true }, scenarioId) };
    const byPhase = (list) => { const m = new Map(); list.forEach((x) => { if (!m.has(x.phase)) m.set(x.phase, []); m.get(x.phase).push(x); }); return m; };
    const mine = byPhase(steps), theirs = Object.fromEntries(Object.entries(runs).map(([k, r]) => [k, byPhase(r.steps)]));
    for (const st of steps) {
      const list = mine.get(st.phase), f = (list.indexOf(st) + 1) / list.length;
      for (const [k, ph] of Object.entries(theirs)) {
        const other = ph.get(st.phase) ?? [];
        const o = other[Math.max(0, Math.ceil(f * other.length) - 1)];
        st.counters = { ...st.counters, [`${k}.sent`]: o?.counters.sent ?? 0, [`${k}.bytes`]: o?.counters.bytes ?? 0 };
      }
    }
  }
  const zero = { records: 0, bytes: 0, tasks: 0, time: 0, sent: 0 };
  return {
    run, steps, phases, events, keys, counters, duration: t,
    snapshot: (i) => ({ counters: i <= 0 ? zero : steps[i - 1].counters }),
    get final() { return { counters: steps[steps.length - 1].counters }; },
  };
}

// ---------------- layout (world units) ----------------
const REC = { w: 84, h: 22, gap: 6 }, PAGE = { w: 84, h: 22 };
function layout(tl) {
  const { run } = tl;
  const occ = {};
  for (const s of [run.opening, ...tl.steps]) for (const b in s.slots) occ[b] = Math.max(occ[b] ?? 0, s.slots[b].length);
  const L = {};
  const boxH = (rows, rowH) => 30 + 10 + rows * rowH + (rows - 1) * REC.gap + 12;
  const col = (ids, x, w, rows, rowH) => {
    const hs = ids.map((id) => boxH(rows(id), rowH));
    const totalH = hs.reduce((a, b) => a + b, 0) + (ids.length - 1) * 22;
    let y = -totalH / 2;
    ids.forEach((id, i) => { L[id] = { x, y: y + hs[i] / 2, w, h: hs[i], cols: id.startsWith("m") || id.startsWith("r") ? 2 : 1, rowH }; y += hs[i] + 22; });
  };
  col(["input"], -500, 120, () => Math.max(3, occ.input ?? 1), PAGE.h);
  col(run.mapIds, -248, 196, (id) => Math.max(1, Math.ceil((occ[id] ?? 1) / 2)), REC.h);

    const p = box("r1"); hud.inspect(info("r1"), { ...p, pinned: true });
    const rec = lastFrame.draw.find((d) => d.it.kind === "record" && d.op > 0.9);
    if (rec && Q.get("size") !== "phone") { const [x, y] = toScreen(lastM, rec.x + 10, rec.y + 4); hoverId = rec.id; hud.inspect(info(rec.id), { x, y }); }
  }
  if (open === "tip") {
    await wait(50);
    root.querySelectorAll(".ix-tools .ix-btn")[1].dispatchEvent(new PointerEvent("pointerover", { bubbles: true, pointerType: "mouse" }));
    await wait(600);
  }
  if (Q.has("capture")) hud.setCapture(true, { chrome: Q.get("capture") === "chrome" });
  if (open === "notice") hud.notice("WebGL is unavailable in this browser. The captions, controls and readout still work.", { duration: 0 });
  if (open === "focus") { root.querySelector(Q.get("sel") || ".ix-play").focus(); await wait(60); }
  if ((open === "ask" || open === "reveal") && askStep) {
    time = askStep.t0 - 0.0005; playing = false; pendingAsk = askStep; hud.ask(askStep.ask);
    if (open === "reveal") {
      await wait(60);
      root.querySelector(".ix-opt:nth-child(2)")?.click();
      time = askStep.t0 + askStep.dur * 0.82; playing = false;
    }
  }
  if (open === "preview") {
    const sc = root.querySelector(".ix-scrub"), r = sc.getBoundingClientRect();
    sc.dispatchEvent(new PointerEvent("pointermove", { clientX: r.left + r.width * 0.46, clientY: r.top + r.height / 2, bubbles: true, pointerType: "mouse" }));
  }
  await wait(Q.has("at") || Q.has("kind") ? 700 : 200);
})();
</script>
