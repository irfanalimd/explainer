<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD browser tests</title>
<link rel="stylesheet" href="hud.css">
<style>html, body { margin: 0; height: 100%; overflow: hidden; } #ix { position: fixed; inset: 0; }</style>
</head>
<body>
<div id="ix" class="ix"><canvas class="ix-canvas"></canvas></div>
<script type="module">
// Browser checks for the HUD: input routing, keyboard map, scrubbing, throttling, diffed updates, tags, deep links, perf.
// node scripts/snap.mjs engine/hud/test.html --out /tmp/t.png --eval "window.__results"
import { createHud } from "./hud.mjs";

history.replaceState(null, "", "#s=crash&t=3.5&p=mappers:5,input:a%2Cb,combiner:1");
try { for (const k of Object.keys(localStorage)) if (k.startsWith("ix:")) localStorage.removeItem(k); } catch {}
const calls = [];
const spy = new Proxy({}, { get: (_, name) => (...args) => { calls.push([name, ...args]); } });
const cb = {};
for (const n of ["onPlay", "onPause", "onToggle", "onSeek", "onStep", "onPhase", "onSpeed", "onScenario", "onParams", "onTheme", "onFit", "onFullscreen", "onRestart", "onHover", "onSelect", "onRefHover", "onGesture", "onAnswer", "onUnpin", "onStart", "onIntro", "onContinue", "onGuided", "onRefSelect"]) cb[n] = spy[n];
const params = {
  mappers: { label: "Mappers", type: "int", min: 1, max: 6, value: 3 },
  combiner: { label: "Combiner", type: "bool", value: false },
  input: { label: "Input", type: "text", value: "the fox" },
  seed: { label: "Seed", type: "int", value: 7 },
};
const scenarios = [{ id: "happy", label: "Happy path", description: "Every machine stays healthy." },
  { id: "crash", label: "Worker dies", params: { crash: 1 }, description: "A mapper dies mid-task and its split runs again." }];
const root = document.getElementById("ix");
const hud = createHud(root, {
  meta: { title: "MapReduce", subtitle: "Counting words", kicker: "Distributed systems", fig: 1, cite: { text: "Dean & Ghemawat" } },
  params, values: { mappers: 3, combiner: false, input: "the fox", seed: 7 }, scenarios, scenario: "happy",
  counters: { bytes: { label: "shuffled", format: "bytes" }, tasks: { label: "tasks", format: "int" } },
  code: { lang: "python", source: "def f(x):\n    return x\n" }, theme: "dark",
}, cb);
const steps = Array.from({ length: 20 }, (_, i) => ({ index: i, t0: i, t1: i + 1, dur: 1, caption: `Step ${i} moves {key:fox} to {ref:m${i % 3}|mapper ${i % 3}}`, phase: i < 10 ? "Map" : "Reduce", ask: i === 12 ? { question: "Where?", options: ["Here", "There"], answer: 1 } : null }));
const tl = {
  steps, duration: 20, phases: [{ name: "Map", step: 0, t0: 0, t1: 10 }, { name: "Reduce", step: 10, t0: 10, t1: 20 }],
  events: steps.map((s) => ({ t: s.t0 + 0.2, kind: s.index === 4 ? "crash" : "send", step: s.index })),
  keys: [{ name: "fox", index: 3 }, { name: "the", index: 0 }],
  counters: { bytes: { label: "shuffled", format: "bytes" }, tasks: { label: "tasks", format: "int" } },
};
hud.setTimeline(tl);
const entities = new Map([["m0", { title: "Mapper 0" }], ["m1", { title: "Mapper 1" }], ["m2", { title: "Mapper 2" }]]);
const frame = (t, extra = {}) => ({ time: t, step: Math.min(19, Math.floor(t)), u: t % 1, caption: steps[Math.min(19, Math.floor(t))].caption, phase: "Map", tags: [], counters: { bytes: 1400, tasks: 2 }, line: [2, 2], entities, poses: [{ key: 3, opacity: 1 }, { key: 0, opacity: 1 }], ...extra });

const results = [];
const check = (name, ok, detail) => results.push({ name, ok: !!ok, ...(ok ? {} : { detail }) });
const take = (name) => { const r = calls.filter((c) => c[0] === name); return r; };
const reset = () => { calls.length = 0; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const FITS = ["ix-ex-fit-defs", "ix-ex-fit-about", "ix-ex-fit-earlier", "ix-ex-fit-tight"];
const frameWait = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
const key = (k, o = {}, target = document.body) => target.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true, ...o }));
const ptr = (el, type, x, y, o = {}) => el.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, bubbles: true, cancelable: true, pointerId: o.id ?? 1, pointerType: o.pointerType ?? "mouse", button: o.button ?? 0, buttons: o.buttons ?? 1, shiftKey: !!o.shift }));

window.__results = (async () => {
  await document.fonts.ready;
  hud.update(frame(3.5), { time: 3.5, playing: false, speed: 1 });
  await frameWait();

  // structure
  check("title rendered", root.querySelector(".ix-heading").textContent === "MapReduce");
  check("no kicker or citation line in the title block", !root.querySelector(".ix-title .ix-kicker, .ix-title .ix-cite, .ix-about .ix-kicker"));
  check("title is plain text without a paper url", !root.querySelector(".ix-heading a"));
  {
    const meta0 = { title: "MapReduce", subtitle: "Counting words", kicker: "Distributed systems", fig: 1, cite: { text: "Dean & Ghemawat" } };
    hud.setMeta({ ...meta0, cite: { text: "Dean & Ghemawat, OSDI 2004", url: "https://example.org/mr.pdf" } });
    const a = root.querySelector(".ix-heading a.ix-title-link");
    check("title links to the paper in a new tab", !!a && a.href === "https://example.org/mr.pdf" && a.target === "_blank" && a.rel === "noopener"
      && a.getAttribute("aria-label") === "MapReduce — read the paper: Dean & Ghemawat, OSDI 2004" && a.title === a.getAttribute("aria-label")
      && root.querySelector(".ix-heading").textContent === "MapReduce");
    check("hover arrow hidden at rest", getComputedStyle(a.querySelector(".ix-title-arrow")).opacity === "0");
    hud.setMeta(meta0);
  }
  // stories: a segmented strip at the top centre of the stage (every story in view), not under the title or in the toolbar
  const storyBtn = root.querySelector(".ix-story"), storyBar = root.querySelector(".ix-stories");
  const strip = root.querySelector(".ix-stories-strip"), tabs = [...root.querySelectorAll(".ix-stories-tab")];
  check("the stories sit in the header row between the title and the toolbar, not under the title", !!root.querySelector(".ix-top > .ix-stories")
    && !root.querySelector(".ix-title .ix-story, .ix-title .ix-stories, .ix-story-row, .ix-tab, .ix-tabs, .ix-select-wrap") && root.querySelectorAll(".ix-toolbar > *").length === 1);
  check("wide: the full strip shows, the pill is out of the accessibility tree", root.dataset.stories === "strip"
    && getComputedStyle(strip).display !== "none" && getComputedStyle(storyBtn).display === "none" && tabs.length === 2
    && tabs.map((b) => b.textContent).join("|") === "Happy path|Worker dies", [root.dataset.stories, tabs.map((b) => b.textContent)]);
  check("the strip is one labelled radio group: Scenario n of N names, the current one checked and the only tab stop",
    strip.getAttribute("role") === "radiogroup" && strip.getAttribute("aria-label") === "Scenarios" && tabs.every((b) => b.getAttribute("role") === "radio")
    && tabs[0].getAttribute("aria-label") === "Scenario 1 of 2: Happy path" && tabs[1].getAttribute("aria-label") === "Scenario 2 of 2: Worker dies"
    && tabs[0].getAttribute("aria-checked") === "true" && tabs[1].getAttribute("aria-checked") === "false" && tabs[0].tabIndex === 0 && tabs[1].tabIndex === -1,
    tabs.map((b) => [b.getAttribute("aria-label"), b.getAttribute("aria-checked"), b.tabIndex]));
  check("each story carries its description for the tooltip and screen readers, and its digit", tabs[1].dataset.tip === "A mapper dies mid-task and its split runs again."
    && tabs[1].dataset.tipHead === "Worker dies" && tabs[1].dataset.kbd === "2" && tabs[1].getAttribute("aria-description") === tabs[1].dataset.tip);
  {
    const rr = root.getBoundingClientRect(), sb = storyBar.getBoundingClientRect(), tt = root.querySelector(".ix-title").getBoundingClientRect(), tb = root.querySelector(".ix-toolbar").getBoundingClientRect();
    const free = (hud.insets.left + rr.width - hud.insets.right) / 2;
    check("the strip is centred on the free stage, clear of the title and the toolbar, on the toolbar's row",
      Math.abs(sb.left + sb.width / 2 - rr.left - free) <= 1 && sb.left >= tt.right + 16 && sb.right <= tb.left - 16
      && Math.round(sb.top) === Math.round(tb.top) && Math.round(sb.height) === 40, [sb.left, sb.width, free, tt.right, tb.left, sb.top, tb.top]);
    const th = root.querySelector(".ix-stories-thumb").getBoundingClientRect(), t0 = tabs[0].getBoundingClientRect();
    check("the thumb sits under the current story", Math.abs(th.left - t0.left) < 1 && Math.abs(th.width - t0.width) < 1, [th.left, t0.left, th.width, t0.width]);
  }
  check("the pill (the collapsed form) is compact: Scenario · its name; its accessible name keeps the position",
    storyBtn.textContent.replace(/\s+/g, " ").trim() === "ScenarioHappy path" && !/of 2/.test(storyBtn.textContent)
    && getComputedStyle(root.querySelector(".ix-story-k"), "::after").content === '"·"'
    && storyBtn.getAttribute("aria-label") === "Scenario 1 of 2: Happy path. Choose another scenario" && storyBtn.getAttribute("aria-haspopup") === "menu", storyBtn.textContent);
  check("the header is the title alone on the left: no subtitle or story description beside it",
    !root.querySelector(".ix-subtitle, .ix-story-desc, .ix-story-pos") && !root.querySelector(".ix-title").textContent.includes("Counting words")
    && !root.querySelector(".ix-top").textContent.includes("Every machine stays healthy")
    && [...root.querySelector(".ix-head-row").children].every((e) => e.matches(".ix-heading, .ix-about-btn")));
  check("insets.top is the header row's bottom (the strip adds no height)", hud.insets.top === Math.round(root.querySelector(".ix-top").getBoundingClientRect().bottom), hud.insets);
  {
    const note = root.querySelector(".ix-story-note");
    check("the story note is a polite status line, hidden at rest", note?.getAttribute("role") === "status" && note.getAttribute("aria-live") === "polite"
      && !note.classList.contains("ix-show") && getComputedStyle(note).visibility === "hidden" && getComputedStyle(note).position === "absolute");
  }
  check("canvas labelled", root.querySelector("canvas").getAttribute("role") === "img" && /MapReduce/.test(root.querySelector("canvas").getAttribute("aria-label")));
  check("chapter segments", root.querySelectorAll(".ix-segs-fill .ix-seg").length === 2);
  check("crash tick coloured", root.querySelectorAll(".ix-tick-fail").length === 1 && root.querySelectorAll(".ix-tick-ask").length === 1);
  check("step counter", root.querySelector(".ix-count-cur").textContent === "4" && root.querySelector(".ix-count-tot").textContent === "20");
  const chip = root.querySelector(".ix-cap .ix-key");
  check("caption key chip uses identity var", chip && chip.style.getPropertyValue("--k") === "var(--ix-key-3)");
  check("caption ref chip text", root.querySelector(".ix-cap .ix-ref")?.textContent === "mapper 0");
  check("legend shows present keys", root.querySelectorAll(".ix-legend-item").length === 2);

  // deep link
  const init = hud.initialState();
  check("deep link parsed", init.scenario === "crash" && init.time === 3.5 && init.params.mappers === 5 && init.params.input === "a,b" && init.params.combiner === true, init);

  // diffed update: an identical frame touches nothing
  const mo = new MutationObserver(() => {}); mo.observe(root, { subtree: true, childList: true, attributes: true, characterData: true });
  mo.takeRecords();
  const f = frame(3.5);
  hud.update(f, { time: 3.5, playing: false, speed: 1 });
  hud.update(f, { time: 3.5, playing: false, speed: 1 });
  const muts = mo.takeRecords().length;
  check("identical frames cause no DOM mutations", muts === 0, { muts });
  hud.update(frame(3.6), { time: 3.6, playing: false, speed: 1 });
  const m2 = mo.takeRecords();
  check("a time change only moves the playhead", m2.length <= 2 && m2.every((r) => r.type === "attributes" && r.attributeName === "style"), m2.map((r) => r.target.className + ":" + r.attributeName));
  mo.disconnect();

  // keyboard map
  reset();
  key(" "); key("ArrowRight"); key("ArrowLeft", { shiftKey: true }); key("Home"); key("End"); key("]"); key("["); key("2"); key("f"); key("r");
  check("space toggles", take("onToggle").length === 1);
  check("arrow steps", take("onStep")[0]?.[1] === 1);
  check("shift-arrow phases", take("onPhase")[0]?.[1] === -1);
  const seeks = take("onSeek");
  check("home and end seek", seeks[0]?.[1] === 0 && seeks[1]?.[1] === 20, seeks);
  const sp = take("onSpeed").map((c) => c[1]);
  check("] and [ change speed through MOTION.speeds", sp[0] === 1.5 && sp[1] === 1, sp);
  check("digit picks scenario", take("onScenario")[0]?.[1] === "crash");
  check("F fits, R restarts", take("onFit").length === 1 && take("onRestart").length === 1);
  reset();
  key("t");
  check("T toggles theme", take("onTheme")[0]?.[1] === "light" && root.dataset.theme === "light");
  key("t");
  key("c");
  check("C opens code", root.querySelector(".ix-code").classList.contains("ix-open"));
  key("c");
  key("?");
  check("? opens help", root.querySelector(".ix-help").classList.contains("ix-open"));
  key("Escape", {}, document.activeElement);
  check("Esc closes help", !root.querySelector(".ix-help").classList.contains("ix-open"));
  reset();
  key(" ", { metaKey: true });
  check("modified keys are left to the browser", take("onToggle").length === 0);

  // typing in settings is not hijacked
  hud.open("settings", true);
  await wait(30);
  const text = root.querySelector(".ix-textarea");
  text.focus();
  reset();
  key(" ", {}, text); key("ArrowRight", {}, text); key("t", {}, text);
  check("keys inside inputs are ignored", calls.length === 0, calls);
  key("Escape", {}, text);
  check("Esc in an input closes the drawer", !root.querySelector(".ix-drawer").classList.contains("ix-open"));

  // sliders: throttled while dragging, final value always sent
  hud.open("settings", true);
  const range = root.querySelector(".ix-range");
  reset();
  for (let i = 0; i < 25; i++) { range.value = String(1 + (i % 6)); range.dispatchEvent(new Event("input", { bubbles: true })); }
  range.value = "5"; range.dispatchEvent(new Event("input", { bubbles: true }));
  const during = take("onParams").length;
  range.dispatchEvent(new Event("change", { bubbles: true }));
  const sent = take("onParams");
  check("slider input is throttled", during <= 2, { during });
  check("slider release sends the final value", sent[sent.length - 1]?.[1]?.mappers === 5, sent.map((c) => c[1].mappers));
  check("slider shows the live value", root.querySelector(".ix-knob-val").textContent === "5");
  reset();
  root.querySelector(".ix-switch").click();
  check("switch sends params", take("onParams")[0]?.[1]?.combiner === true);
  reset();
  root.querySelector(".ix-btn-field").click();
  const seed = take("onParams")[0]?.[1]?.seed;
  check("seed reroll sends a new seed", Number.isInteger(seed) && seed !== 7, { seed });
  hud.open("settings", false);
  hud.setValues({ mappers: 2 });
  check("setValues reflects without firing", take("onParams").length === 1 && root.querySelector(".ix-knob-val").textContent === "2");

  // scrubbing
  const scrub = root.querySelector(".ix-scrub");
  const r = scrub.getBoundingClientRect();
  reset();
  ptr(scrub, "pointerdown", r.left + r.width * 0.25, r.top + 20);
  ptr(scrub, "pointermove", r.left + r.width * 0.5, r.top + 20);
  await frameWait();
  ptr(scrub, "pointermove", r.left + r.width * 0.75, r.top + 20);
  await frameWait();
  ptr(scrub, "pointerup", r.left + r.width * 0.75, r.top + 20);
  const sk = take("onSeek");
  const last = sk[sk.length - 1];
  check("scrub seeks continuously, then once with scrubbing:false", sk.length >= 3 && sk.slice(0, -1).every((c) => c[2].scrubbing === true) && last[2].scrubbing === false && Math.abs(last[1] - 15) < 0.2, sk.map((c) => [c[1].toFixed(2), c[2].scrubbing]));
  ptr(scrub, "pointermove", r.left + r.width * 0.62, r.top + 20, { buttons: 0 });
  check("hover preview shows step and caption", root.querySelector(".ix-preview").classList.contains("ix-show") && /Step 13 of 20/.test(root.querySelector(".ix-preview-meta").textContent));
  ptr(scrub, "pointerleave", 0, 0, { buttons: 0 });
  reset();
  scrub.focus();
  key("ArrowRight", {}, scrub); key("PageDown", {}, scrub);
  check("scrubber keys", take("onStep")[0]?.[1] === 1 && take("onPhase")[0]?.[1] === 1);

  // stage pointer
  const stage = root.querySelector(".ix-stage");
  reset();
  ptr(stage, "pointermove", 400, 300, { buttons: 0 });
  await frameWait();
  check("hover reports root coordinates", take("onHover")[0]?.[1] === 400 && take("onHover")[0]?.[2] === 300);
  reset();
  ptr(stage, "pointerdown", 400, 300); ptr(stage, "pointerup", 400, 300);
  check("click selects", take("onSelect")[0]?.[1] === 400);
  await wait(400);
  reset();
  ptr(stage, "pointerdown", 400, 300); ptr(stage, "pointermove", 420, 310); ptr(stage, "pointermove", 450, 320); await frameWait(); ptr(stage, "pointerup", 450, 320);
  const g = take("onGesture");
  const dx = g.filter((c) => c[1].type === "orbit").reduce((a, c) => a + c[1].dx, 0);
  check("drag orbits, no select", dx === 50 && take("onSelect").length === 0, g.map((c) => c[1]));
  reset();
  ptr(stage, "pointerdown", 400, 300, { shift: true }); ptr(stage, "pointermove", 430, 300, { shift: true }); await frameWait(); ptr(stage, "pointerup", 430, 300);
  check("shift-drag pans", take("onGesture").some((c) => c[1].type === "pan" && c[1].dx === 30));
  reset();
  stage.dispatchEvent(new WheelEvent("wheel", { deltaY: -100, clientX: 500, clientY: 300, bubbles: true, cancelable: true }));
  await frameWait();
  const z = take("onGesture").find((c) => c[1].type === "zoom");
  check("wheel zooms in", z && z[1].scale > 1, z);
  await wait(400);
  reset();
  ptr(stage, "pointerdown", 300, 200); ptr(stage, "pointerup", 300, 200);
  ptr(stage, "pointerdown", 301, 200); ptr(stage, "pointerup", 301, 200);
  check("double-click focuses", take("onGesture").some((c) => c[1].type === "focus"));

  // caption ref hover
  reset();
  const ref = root.querySelector(".ix-cap .ix-ref");
  ref.dispatchEvent(new PointerEvent("pointerover", { bubbles: true }));
  root.querySelector(".ix-caption").dispatchEvent(new PointerEvent("pointerleave"));
  const rh = take("onRefHover").map((c) => c[1]);
  check("ref chip hover lights and clears", rh[0] === "m0" && rh[1] === null, rh);

  // counters count up to the formatted value
  hud.update(frame(4.2, { counters: { bytes: 4096, tasks: 3 } }), { time: 4.2, playing: true, speed: 1 });
  await wait(700);
  const vals = [...root.querySelectorAll(".ix-meter-val")].map((e) => e.textContent);
  check("meters format and settle", vals[0] === "4KB" && vals[1] === "3", vals);

  // tags never overlap
  hud.placeTags([
    { id: "a", text: 'hash("fox") % 2 = 1', x: 600, y: 400, opacity: 1 },
    { id: "b", text: 'hash("fox") % 2 = 1', x: 640, y: 405, opacity: 1 },
    { id: "c", text: "heartbeat missed", tone: "fail", x: 620, y: 395, opacity: 1 },
  ]);
  for (let i = 0; i < 30; i++) { hud.placeTags([
    { id: "a", text: 'hash("fox") % 2 = 1', x: 600, y: 400, opacity: 1 },
    { id: "b", text: 'hash("fox") % 2 = 1', x: 640, y: 405, opacity: 1 },
    { id: "c", text: "heartbeat missed", tone: "fail", x: 620, y: 395, opacity: 1 },
  ]); }
  const rects = [...root.querySelectorAll(".ix-tag")].map((e) => e.getBoundingClientRect());
  const overlap = rects.some((a, i) => rects.some((b, j) => j > i && a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top));
  check("tags do not overlap", rects.length === 3 && !overlap, rects.map((q) => [q.left, q.top, q.width, q.height].map(Math.round)));
  hud.placeTags([]);

  // inspector
  hud.inspect({ id: "m1", kind: "housing", title: "Mapper 1", state: { status: "ok", records: 4 } }, { x: 300, y: 300 });
  check("hover inspector shows", root.querySelector(".ix-inspector:not(.ix-pinned)").classList.contains("ix-show"));
  hud.inspect({ id: "m1", kind: "housing", title: "Mapper 1", state: { status: "ok", records: 4 } }, { x: 300, y: 300, pinned: true });
  check("pinning the hovered entity replaces the hover card", root.querySelector(".ix-pinned").classList.contains("ix-show") && !root.querySelector(".ix-inspector:not(.ix-pinned)").classList.contains("ix-show"));
  reset();
  root.querySelector(".ix-pinned .ix-close").click();
  check("unpin button", !root.querySelector(".ix-pinned").classList.contains("ix-show") && take("onUnpin").length === 1);
  check("no stray null text", !/null|undefined/.test(root.querySelector(".ix-hud").textContent + root.querySelector(".ix-pinned").textContent));

  // predict
  hud.ask(steps[12].ask);
  hud.ask(steps[12].ask);
  check("ask shows once", root.querySelectorAll(".ix-opt").length === 2 && root.querySelector(".ix-predict").classList.contains("ix-open"));
  reset();
  root.querySelectorAll(".ix-opt")[0].click();
  check("answer callback", take("onAnswer")[0]?.[1] === 0);
  hud.ask(null);
  check("ask(null) keeps an answered card for its reveal", root.querySelector(".ix-predict").classList.contains("ix-open"));
  hud.update(frame(12.8), { time: 12.8, playing: false, speed: 1 });
  check("reveal marks right and wrong", root.querySelector(".ix-opt.ix-correct") === root.querySelectorAll(".ix-opt")[1] && root.querySelector(".ix-opt.ix-wrong") === root.querySelectorAll(".ix-opt")[0]);
  key("Escape");
  check("Esc dismisses the revealed card", !root.querySelector(".ix-predict").classList.contains("ix-open"));

  // deep link write-back while playing (debounced)
  history.replaceState(null, "", "#");
  for (let i = 0; i < 10; i++) hud.update(frame(5 + i * 0.1), { time: 5 + i * 0.1, playing: true, speed: 1 });
  await wait(650);
  check("hash written while playing", /t=5\.9/.test(location.hash) && /p=mappers:2/.test(location.hash), location.hash);

  // perf: a playing frame
  const N = 2000;
  const t0 = performance.now();
  for (let i = 0; i < N; i++) { const t = 6 + i * 0.004; hud.update(frame(t, { counters: { bytes: 1400 + i, tasks: 3 } }), { time: t, playing: true, speed: 1 }); }
  const per = (performance.now() - t0) / N;
  check("update cost under 0.5 ms", per < 0.5, { per });
  const tags = Array.from({ length: 8 }, (_, i) => ({ id: "p" + i, text: `tag ${i}`, x: 200 + i * 90, y: 300 + (i % 3) * 8, opacity: 1 }));
  const t1 = performance.now();
  for (let i = 0; i < 500; i++) { for (const tg of tags) tg.x += 0.1; hud.placeTags(tags); }
  const perTags = (performance.now() - t1) / 500;
  check("placeTags cost under 0.3 ms for 8 tags", perTags < 0.3, { perTags });

  // tags keep clear of panels: lifted just above one, faded when they would sit under it (the dock here)
  const mr = root.querySelector(".ix-bar").getBoundingClientRect();
  const under = { id: "u", text: "under the dock", x: mr.left + mr.width * 0.7, y: mr.bottom - 4, opacity: 1 };

        check(`${tag}: the backstop dropped what it had to, in order`, pC.classList.contains("ix-ex-fit-defs") && (!pC.classList.contains("ix-ex-fit-earlier") || pC.classList.contains("ix-ex-fit-about")), pC.className);
      }
    }
    // the card leaves: the panel is whole again (Earlier back, the about unclamped)
    rC.querySelector(".ix-predict .ix-close")?.click();
    await frameWait();
    if (docked) check(`${tag}: once the card leaves, Earlier and the full about come back`, !pC.querySelector(".ix-ex-earlier").hidden && !pC.querySelector(".ix-ex-clamp")
      && !FITS.some((c) => pC.classList.contains(c)), pC.className);
    hC.destroy();
    rC.remove();
  }

  // reduced motion: counters snap, no caption rise; destroy removes everything
  const root2 = document.createElement("div");
  root2.style.cssText = "position:fixed;left:0;top:0;width:800px;height:600px;visibility:hidden";
  root2.append(document.createElement("canvas"));
  document.body.append(root2);
  const hud2 = createHud(root2, { meta: { title: "T" }, counters: { n: { label: "n", format: "int" } }, reducedMotion: true, hash: false }, {});
  hud2.setTimeline({ ...tl, counters: { n: { label: "n", format: "int" } } });
  hud2.update(frame(1, { counters: { n: 0 } }), { time: 1, playing: true, speed: 1 });
  hud2.update(frame(2, { counters: { n: 900 } }), { time: 2, playing: true, speed: 1 });
  check("reduced motion is exposed and snaps counters", hud2.reducedMotion === true && root2.classList.contains("ix-reduced") && root2.querySelector(".ix-meter-num").textContent === "900");
  hud2.update(frame(9.999), { time: 9.999, playing: false, speed: 1, held: { kind: "chapter", phase: 0 } });
  const p2 = root2.querySelector(".ix-play");
  // the steady highlight is the solid primary pill itself (the chrome has no accent ring or glow, DESIGN.md 9.1)
  const probe2 = document.createElement("i"); probe2.style.background = "var(--ix-primary)"; root2.append(probe2);
  const primary2 = getComputedStyle(probe2).backgroundColor; probe2.remove();
  check("reduced motion: Continue keeps its steady highlight but never pulses", p2.classList.contains("ix-continue")
    && getComputedStyle(p2, "::after").animationName === "none" && getComputedStyle(p2).animationName === "none" && getComputedStyle(p2).backgroundColor === primary2,
    [getComputedStyle(p2, "::after").animationName, getComputedStyle(p2).animationName, getComputedStyle(p2).backgroundColor, primary2]);
  const capT = getComputedStyle(root2.querySelector(".ix-cap")).transitionProperty;
  check("reduced motion captions only fade", !/transform/.test(capT), capT);
  hud2.destroy();
  check("destroy leaves only the canvas", root2.children.length === 1 && root2.firstChild.tagName === "CANVAS");
  root2.remove();

  return { pass: results.filter((r) => r.ok).length, fail: results.filter((r) => !r.ok), perUpdateMs: +per.toFixed(4), perTagsMs: +perTags.toFixed(4) };
})();
